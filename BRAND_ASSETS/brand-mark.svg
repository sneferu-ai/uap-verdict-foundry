<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="UAP Verdict Foundry mark">
  <title>UAP Verdict Foundry mark</title>
  <desc>Two evidence paths converge through a neutral aperture and leave as one resolved record.</desc>
  <rect width="100" height="100" rx="16" fill="#1C1E25"/>
  <!-- Ledger line -->
  <rect x="18" y="72" width="64" height="4" rx="2" fill="#707172"/>
  <!-- Aperture / neutral circle -->
  <circle cx="50" cy="44" r="16" fill="none" stroke="#7A9D87" stroke-width="4"/>
  <!-- Left evidence path -->
  <path d="M20 76 L38 52" stroke="#ABDFB9" stroke-width="4" stroke-linecap="round"/>
  <!-- Right evidence path -->
  <path d="M80 76 L62 52" stroke="#ABDFB9" stroke-width="4" stroke-linecap="round"/>
  <!-- Output record -->
  <path d="M50 60 L50 76" stroke="#ABDFB9" stroke-width="4" stroke-linecap="round"/>
</svg>
